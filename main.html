<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<title>Creat Account</title>
	</head>
	<body>
		<button type="submit" data-toggle="modal" data-target="#signupModal" class="btn btn-primary">Sign Up</button>
		<div class="modal fade" id="signupModal" tabindex="-1" role="dialog" aria-labelledby="signupModalLabel" aria-hidden="true">
		<div class="modal-dialog">
	    <div class="modal-content">
	    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
        <h4 class="modal-title" id="signupModalLabel">Sign Up</h4>
      </div>
      <div class="modal-body">
		<label for="email">Enter address:</label><br>
		<input type="email" class="form-control" name="email" id="email" placeholder="Enter email">
		<small class="form-text text-muted">Your information is safe with us.</small><br>
		<label for="password">Password:</label><br>
		<input type="password" class="form-control" id="password" name="password" placeholder="Password">
		<br>
		<label for="coonfirmpassword">Confirm Password:</label><br>
		<input type="password" class="form-control" id="confirmpassword" name="confirm password" placeholder="Confirm Password">
		<br>
		  <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
		  </div>
	  </div>
		</div>
		</div>
		
	</body>
</html>
